<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcos — Desenvolvedor Front-end</title>
<meta name="color-scheme" content="dark light"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><script>try{var t=localStorage.getItem("th");if(!t)t=matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#0a0a0a;--bg2:#111;--card:#141414;--line:#262626;--tx:#f5f5f5;--mu:#8f8f8f;--e:cubic-bezier(.16,1,.3,1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f6f4;--bg2:#ececea;--card:#fff;--line:#dcdcd8;--tx:#0a0a0a;--mu:#6b6b6b;color-scheme:light}}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.65;overflow-x:hidden}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.05;margin:0;letter-spacing:-.03em}
h1 span,h2 em,.serif{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em;font-size:1.14em}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
section{padding:96px 0}
.tag{font-family:"Space Grotesk",sans-serif;color:var(--mu);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}
h2{font-size:clamp(2rem,5.5vw,3.2rem);margin-bottom:38px}
#pg{position:fixed;top:0;left:0;right:0;height:2px;background:var(--tx);transform:scaleX(0);transform-origin:0 50%;z-index:30}
nav{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 95%,transparent);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:1.1rem}
.logo b{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:1.2em}
nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0;font-size:.9rem;color:var(--mu)}
nav ul a{transition:color .3s}nav ul a:hover{color:var(--tx)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:2px;font-weight:600;border:1px solid var(--line);transition:transform .5s var(--e),background .4s,color .4s,border-color .4s}
.btn.p{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn:hover{transform:translateY(-3px)}
.btn.s:hover{border-color:var(--tx)}
@keyframes up{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes rev{from{clip-path:inset(100% 0 0 0);transform:scale(1.18)}to{clip-path:inset(0);transform:none}}
.hero{padding-top:150px}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:56px;align-items:center}
.hero .wrap>div:first-child>*{animation:up 1.2s var(--e) both}
.hero .wrap>div:first-child>:nth-child(2){animation-delay:.12s}.hero .wrap>div:first-child>:nth-child(3){animation-delay:.24s}.hero .wrap>div:first-child>:nth-child(4){animation-delay:.36s}
.pill{display:inline-flex;gap:10px;align-items:center;font-size:.84rem;padding:7px 15px;border:1px solid var(--line);border-radius:2px;color:var(--mu);margin-bottom:26px}
.dot{width:7px;height:7px;border-radius:2px;background:var(--tx);animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
h1{font-size:clamp(2.6rem,8vw,5.2rem);margin-bottom:24px}
.lead{color:var(--mu);font-size:1.08rem;max-width:520px;margin:0 0 34px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.photo{position:relative;justify-self:center;width:min(100%,360px)}
.photo::before{content:"";position:absolute;inset:-12px 12px 12px -12px;border:1px solid var(--line);border-radius:2px;animation:up 1.4s var(--e) .3s both}
.photo img{position:relative;display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:2px;animation:rev 1.6s var(--e) .15s both}
